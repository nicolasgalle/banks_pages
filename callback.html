<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorisation bancaire — Nicolas Finance</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5}code{display:block;padding:12px;background:#f3f3f3;overflow-wrap:anywhere;user-select:all}button{padding:10px 14px;cursor:pointer}.warning{color:#8a1c1c}</style></head><body><h1>Autorisation bancaire</h1><div id="content">Lecture du résultat de l'autorisation…</div><script>const p=new URLSearchParams(location.search),c=document.getElementById('content'),code=p.get('code'),state=p.get('state'),error=p.get('error'),desc=p.get('error_description');function e(v){return String(v).replace(/[&<>\'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}if(error)c.innerHTML=`<p class="warning"><strong>Autorisation refusée ou interrompue.</strong></p><p>${e(error)} ${e(desc||'')}</p>`;else if(!code)c.innerHTML='<p class="warning">Aucun code d’autorisation n’a été reçu.</p>';else{c.innerHTML=`<p><strong>Autorisation reçue.</strong></p><p>Copie le code ci-dessous dans le script local. Ne le publie pas et ne le partage pas.</p><p><code id="code"></code></p><button id="copy">Copier le code</button><p>State reçu : <code>${e(state||'(absent)')}</code></p><p>Tu peux ensuite fermer cet onglet.</p>`;document.getElementById('code').textContent=code;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('copy').textContent='Code copié'}catch{document.getElementById('copy').textContent='Copie impossible — sélectionne le code manuellement'}}}</script></body></html>
